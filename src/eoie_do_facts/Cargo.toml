[package.metadata.spiral]
entry = "run.spi"
output = "do_facts.rs"

[package]
name = "eoie-do-facts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "eoie_do_facts"
path = "do_facts.rs"

[dependencies]
eoie-do-read = { path = "../eoie_do_read" }
eoie-do-tables = { path = "../eoie_do_tables" }
regex = "1.13.1"
serde_json = "1.0.151"
sha2 = "0.11.1"
