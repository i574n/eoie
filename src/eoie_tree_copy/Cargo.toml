[package.metadata.spiral]
entry = "main.spi"
output = "tree_copy.rs"

[package]
name = "eoie-tree-copy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "tree_copy.rs"

[dependencies]
eoie-rust-std-fs = { path = "../rust_std_fs" }
eoie-rust-std-fs-mutation = { path = "../rust_std_fs_mutation" }

[lints.clippy]
needless_return = "allow"
needless_late_init = "allow"

