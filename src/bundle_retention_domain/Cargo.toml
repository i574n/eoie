[package.metadata.spiral]
entry = "main.spi"
output = "retention.rs"

[[package.metadata.spiral.auxiliary]]
entry = "retention_negative.spi"
output = "retention_negative.rs"

[[package.metadata.spiral.auxiliary]]
entry = "retention_policy_probe.spi"
output = "retention_policy_probe.rs"

[package]
name = "bundle-retention-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bundle_retention_domain"
path = "retention.rs"

[dependencies]
eoie-proxy-search = { path = "../eoie_proxy_search" }
eoie-rust-std-fs = { path = "../rust_std_fs" }

[[example]]
name = "retention_negative"
path = "retention_negative.rs"

[[example]]
name = "retention_policy_probe"
path = "retention_policy_probe.rs"
