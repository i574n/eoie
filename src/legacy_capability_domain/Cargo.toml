[package.metadata.spiral]
entry = "main.spi"
output = "legacy_surface.rs"

[package]
name = "legacy-capability-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "legacy_surface.rs"

[dependencies]
eoie-process-observation = { path = "../eoie_process_observation" }
eoie-rust-std-fs = { path = "../rust_std_fs" }
eoie-rust-std-fs-mutation = { path = "../rust_std_fs_mutation" }
eoie-tree-copy = { path = "../eoie_tree_copy" }

[lints.clippy]
needless_return = "allow"
needless_late_init = "allow"
