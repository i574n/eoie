name: gh-pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: moonrepo/setup-rust@v1
        with:
          channel: "1.88.0"
          components: "rustfmt"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
          gleam-version: "1.19.1"
          rebar3-version: '3.24.0'

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - run: pwsh scripts/workflow.ps1
